[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dn-mi"
version = "0.1.0"
description = "Dimensionality Normalization for Mutual Information: Cross-K Comparability via CDF Transform"
readme = "README.md"
authors = [
    {name = "Arcadia Science", email = "info@arcadiascience.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.5",
    "jupyter>=1.0",
]

[project.urls]
Homepage = "https://github.com/Arcadia-Science/arcadia-info-standardization"
Repository = "https://github.com/Arcadia-Science/arcadia-info-standardization"

[tool.setuptools.packages.find]
where = ["."]
include = ["dn_mi*"]
